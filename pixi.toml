[workspace]
name = "red-eclipse-head-tracking"
version = "0.3.1"
description = "Head tracking mod for Red Eclipse using OpenTrack"
license = "MIT"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
# Sync the cameraunlock-core submodule to its tracked branch.
sync = "git submodule update --remote cameraunlock-core"

# Configure CMake build (x64 - Red Eclipse ships bin/amd64/redeclipse.exe).
# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
# Configures every time rather than skipping when build/ exists: a cache written
# before HEADTRACKING_BUILD_TESTS was set here keeps the old OFF value, and the
# test target then silently vanishes from an otherwise green build.
setup = "cmake -B build -A x64 -DHEADTRACKING_BUILD_TESTS=ON"

# Build debug configuration.
build = { cmd = "cmake --build build --config Debug", depends-on = ["setup"] }

# Build release configuration.
build-release = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }

# Build + deploy release to the game directory.
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build-release"] }

# Remove the mod from the game directory. /y keeps it prompt-free under pixi (no TTY).
uninstall = "scripts\\uninstall.cmd /y"

# Host-side unit tests (HEADTRACKING_BUILD_TESTS, enabled by setup), the config
# differential test against the published build, and the frozen-file check.
test = { cmd = "ctest --test-dir build -C Release --output-on-failure", depends-on = ["build-release"] }

# Rewrites config/RedEclipseHeadTracking.ini, the committed config, from the config table
# after a change to a row, a comment or a default. The config tests fail until it has run.
# There is no launcher seed to re-encode; encode-seed says so.
render-config = { cmd = "build/Release/config_tests.exe --render-config config/RedEclipseHeadTracking.ini && node cameraunlock-core/scripts/encode-seed.mjs", depends-on = ["build-release"] }

# Validates the newest built installer ZIP against its manifest, and that the Nexus ZIP
# carries no config, so run package first. No depends-on: re-running the packager here
# would rebuild the ZIP it is meant to be inspecting.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"

# Package release ZIPs (installer + nexus).
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build-release", "test"] }

# Clean build artifacts. No $vars in inline commands - pixi's shell eats them before PowerShell runs.
clean = { cmd = """
    powershell -Command "if (Test-Path build) { Remove-Item build -Recurse -Force }; if (Test-Path bin) { Remove-Item bin -Recurse -Force }; Write-Host 'Build artifacts cleaned' -ForegroundColor Green"
""" }

# Automated release workflow (version bump, changelog, tag, push).
release = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1" }

# Bump vendored Ultimate ASI Loader to the latest pinned upstream. Manual; commit the result.
update-deps = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1" }

[dependencies]
# No pixi dependencies - using system CMake and Visual Studio.
