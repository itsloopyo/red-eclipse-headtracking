name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@v3

      - name: Configure CMake (x64)
        shell: pwsh
        run: |
          Write-Host "Configuring CMake build (x64)..." -ForegroundColor Cyan
          cmake -B build -A x64 -DHEADTRACKING_BUILD_TESTS=ON

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::CMake configuration failed"
            exit 1
          }

      - name: Build Debug
        shell: pwsh
        run: |
          cmake --build build --config Debug
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Debug build failed"
            exit 1
          }

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Release build failed"
            exit 1
          }

      - name: Run unit tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Unit tests failed"
            exit 1
          }

      - name: Verify build outputs
        shell: pwsh
        run: |
          $required = @(
            "bin/Release/RedEclipseHeadTracking.asi",
            "bin/Debug/RedEclipseHeadTracking.asi"
          )
          $missing = $false
          foreach ($f in $required) {
            if (Test-Path $f) {
              $kb = (Get-Item $f).Length / 1KB
              Write-Host "  $f ($([math]::Round($kb, 2)) KB)" -ForegroundColor Green
            } else {
              Write-Host "  Missing: $f" -ForegroundColor Red
              $missing = $true
            }
          }
          if ($missing) {
            Write-Host "::error::Some build outputs are missing"
            exit 1
          }

      - name: Package installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Packaging failed"
            exit 1
          }

      - name: Stage installer contents for artifact upload
        shell: pwsh
        run: |
          $installer = Get-ChildItem "release/*-installer.zip" | Select-Object -First 1
          if (-not $installer) {
            Write-Host "::error::No installer ZIP found to stage"
            exit 1
          }
          $dest = "release/artifact-contents"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest | Out-Null
          Expand-Archive -Path $installer.FullName -DestinationPath $dest -Force
          Write-Host "Staged $($installer.Name) to $dest" -ForegroundColor Green

      - name: Compute artifact name from ref
        shell: pwsh
        run: |
          $branch = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          $sanitized = $branch -replace '[^A-Za-z0-9._-]', '-'
          "ARTIFACT_NAME=RedEclipseHeadTracking-$sanitized" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release/artifact-contents/
          retention-days: 14
          if-no-files-found: error
          overwrite: true
