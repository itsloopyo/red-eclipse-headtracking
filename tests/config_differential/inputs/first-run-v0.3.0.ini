;  Red Eclipse - Head Tracking configuration
;  Lives next to redeclipse.exe in bin\amd64\.

[General]
EnableOnStartup=1
Port=4242
DataFreshnessMs=500
;  Yaw mode: true = horizon-locked yaw (default), false = camera-local.
WorldSpaceYaw=1

[Sensitivity]
Yaw=1
Pitch=1
Roll=1
InvertYaw=1
InvertPitch=0
InvertRoll=1

[Smoothing]
;  Picked per connection from the tracker's source address, and applied to
;  rotation and position alike. 0 = no smoothing, 1 = heavy.
;  LocalSmoothing: tracker runs on this machine (loopback).
LocalSmoothing=0
;  RemoteSmoothing: tracker is a remote device on the network.
RemoteSmoothing=0.15
DeadzoneDeg=0

[Position]
;  6DOF positional tracking. PositionScale = world units per metre of head translation (Cube uses 8).
Enabled=1
SensitivityX=1
SensitivityY=1
SensitivityZ=1
LimitX=0.3
LimitY=0.2
LimitZ=0.4
LimitZBack=0.1
;  Position uses the [Smoothing] LocalSmoothing / RemoteSmoothing values.
PositionScale=8
InvertX=0
InvertY=0
InvertZ=0

[Hotkeys]
;  Virtual-key codes. Defaults: End (toggle), Page Up (cycle tracking mode), Page Down (yaw mode).
Toggle=0x23
CycleMode=0x21
YawMode=0x22
;  Chord alternatives: Ctrl+Shift+Y (toggle), Ctrl+Shift+G (cycle tracking mode), Ctrl+Shift+H (yaw mode).
ChordToggle=1
ChordCycleMode=1
ChordYawMode=1
